<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Tracker</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main class="page">
    <!-- AUTH -->
    <section id="auth-section" class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <span class="badge">Book Tracker</span>
          <h1>Entre na sua conta</h1>
          <p>Faça login ou crie uma conta para acessar sua biblioteca.</p>
        </div>

        <div class="auth-switch">
          <button type="button" class="switch-btn active" id="show-login">Login</button>
          <button type="button" class="switch-btn" id="show-register">Register</button>
        </div>

        <section id="login-section" class="auth-panel">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="seuemail@email.com" />

          <label for="login-password">Senha</label>
          <input id="login-password" type="password" placeholder="Sua senha" />

          <button id="btn-login" class="primary-btn" type="button">Entrar</button>
        </section>

        <section id="register-section" class="auth-panel hidden">
          <label for="register-name">Nome</label>
          <input id="register-name" type="text" placeholder="Seu nome" />

          <label for="register-email">Email</label>
          <input id="register-email" type="email" placeholder="seuemail@email.com" />

          <label for="register-password">Senha</label>
          <input id="register-password" type="password" placeholder="Crie uma senha" />

          <button id="btn-register" class="primary-btn" type="button">Cadastrar</button>
        </section>
      </div>
    </section>

    <!-- APP -->
    <section id="app-section" class="app-shell hidden">
      <header class="app-header">
        <h1>📚 Book Tracker</h1>
        <nav class="app-nav">
          <a id="nav-list">Listar Livros</a>
          <a id="nav-add">Adicionar Livro</a>
          <a id="nav-logout">Logout</a>
        </nav>
      </header>

      <div class="container">
        <!-- LISTA -->
        <section id="section-list" class="panel">
          <div class="panel-head">
            <h2>Lista de Livros</h2>
            <button id="btn-load" class="secondary-btn">Atualizar</button>
          </div>

          <ul id="bookList" class="book-list">
            <!-- JS insere os livros aqui -->
          </ul>

          <div id="pagination" class="pagination">
            <button id="prev" class="secondary-btn">Anterior</button>
            <span id="page-info">Página 1</span>
            <button id="next" class="secondary-btn">Próximo</button>
          </div>
        </section>

        <!-- ADICIONAR -->
        <section id="section-add" class="panel hidden">
          <h2>Adicionar Livro</h2>

          <div class="form-grid">
            <div class="field">
              <label for="title">Título</label>
              <input id="title" type="text" placeholder="Título do livro" />
            </div>

            <div class="field">
              <label for="author">Autor</label>
              <input id="author" type="text" placeholder="Nome do autor" />
            </div>

            <div class="field">
              <label for="pages">Páginas</label>
              <input id="pages" type="number" placeholder="Quantidade de páginas" />
            </div>

            <div class="field">
              <label for="status">Status</label>
              <select id="status">
                <option value="PLANNED">Para ler</option>
                <option value="READING">Lendo</option>
                <option value="COMPLETE">Lido</option>
              </select>
            </div>

            <div class="field full">
              <label for="rating">Nota (opcional)</label>
              <input id="rating" type="number" step="0.5" placeholder="Ex: 4.5" />
            </div>
          </div>

          <button id="btn-add" class="primary-btn" type="button">Adicionar</button>
        </section>
      </div>
    </section>
  </main>

  <!-- MODAL -->

  <div id="modalEdit" class="overlay hidden">
    <div class="modal">
      <h2>Editar livro</h2>

      <div class="form-grid">
        <div class="field">
          <label for="title">Título</label>
          <input id="modalTitle" type="text" placeholder="Título do livro" />
        </div>

        <div class="field">
          <label for="author">Autor</label>
          <input id="modalAuthor" type="text" placeholder="Nome do autor" />
        </div>

        <div class="field">
          <label for="pages">Páginas</label>
          <input id="modalPages" type="number" placeholder="Quantidade de páginas" />
        </div>

        <div class="field">
          <label for="status">Status</label>
          <select id="modalStatus">
            <option value="PLANNED">Para ler</option>
            <option value="READING">Lendo</option>
            <option value="COMPLETE">Lido</option>
          </select>
        </div>

        <div class="field full">
          <label for="rating">Nota (opcional)</label>
          <input id="modalRating" type="number" step="0.5" placeholder="Ex: 4.5" />
        </div>
        <button id="modalButton" class="primary-btn" type="button">Editar</button>
      </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
